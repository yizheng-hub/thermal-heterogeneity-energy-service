verification:
  claim_checks:
    - claim_id: archive_records_21418
      path: tables/result1_scope.csv
      reducer: value
      column: records
      expected: 21418
      tolerance: 0
    - claim_id: archive_units_12130
      path: tables/result1_scope.csv
      reducer: value
      column: units
      expected: 12130
      tolerance: 0
    - claim_id: archive_buildings_187
      path: tables/result1_scope.csv
      reducer: value
      column: buildings
      expected: 187
      tolerance: 0
    - claim_id: archive_cities_40
      path: tables/result1_scope.csv
      reducer: value
      column: cities
      expected: 40
      tolerance: 0
    - claim_id: archive_countries_15
      path: tables/result1_scope.csv
      reducer: value
      column: countries
      expected: 15
      tolerance: 0
    - claim_id: nus_windows_63
      path: tables/result2_summary.csv
      where: {dataset_code: NUS_HAAS}
      reducer: value
      column: eligible_windows
      expected: 63
      tolerance: 0
    - claim_id: nus_disagreement_49
      path: tables/result2_summary.csv
      where: {dataset_code: NUS_HAAS}
      reducer: value
      column: disagreement_windows
      expected: 49
      tolerance: 0
    - claim_id: nus_opposing_6
      path: tables/result2_summary.csv
      where: {dataset_code: NUS_HAAS}
      reducer: value
      column: opposing_direction_windows
      expected: 6
      tolerance: 0
    - claim_id: february_central_no_positive_selection
      path: tables/headline_results.csv
      where:
        result: Result5
        metric: february_central_full_positive_selection_cells
      reducer: value
      column: value
      expected: 0
      tolerance: 0
    - claim_id: phase_mean_safe_275
      path: tables/result6_phase_map.csv
      where: {classification: mean-safe}
      reducer: rows
      expected: 275
      tolerance: 0
    - claim_id: phase_distribution_required_331
      path: tables/result6_phase_map.csv
      where: {classification: distribution-required}
      reducer: rows
      expected: 331
      tolerance: 0
    - claim_id: phase_unresolved_402
      path: tables/result6_phase_map.csv
      where: {classification: finite-library-unresolved}
      reducer: rows
      expected: 402
      tolerance: 0
    - claim_id: protected_q5_q95_zero_candidate_false_accept
      path: tables/result6_quantile_gate.csv
      where:
        split_scheme: leave_one_context_seed_out
        representation: quantile5
        strategy: pooled_q95
      reducer: value
      column: false_accept_candidates
      expected: 0
      tolerance: 0
    - claim_id: protected_q5_q95_zero_selection_false_accept
      path: tables/result6_quantile_gate.csv
      where:
        split_scheme: leave_one_context_seed_out
        representation: quantile5
        strategy: pooled_q95
      reducer: value
      column: selected_false_accept_decisions
      expected: 0
      tolerance: 0


