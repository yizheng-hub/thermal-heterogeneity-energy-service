[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-heterogeneity"
version = "0.1.0"
description = "Reproducible analysis of human thermal heterogeneity and building outcomes"
readme = {file = "README.txt", content-type = "text/plain"}
requires-python = ">=3.11,<3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "matplotlib==3.9.2",
  "scikit-learn==1.5.2",
  "markdown==3.7",
  "pyyaml==6.0.2",
  "zstandard==0.23.0",
]

[project.optional-dependencies]
notebook = [
  "ipykernel==6.29.5",
  "jupyterlab==4.2.5",
]
test = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.7.1",
]

[project.scripts]
thermal-heterogeneity = "thermal_heterogeneity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thermal_heterogeneity.assets" = ["*.geojson", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["plot/Plot.ipynb"]

[tool.ruff.lint]
# CI focuses on correctness-bearing static errors. Formatting is applied only to
# author-owned public modules and is not allowed to rewrite generated manifests.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"src/utilities/release_scan.py" = ["E402"]
"src/utilities/validate_release_data.py" = ["E741"]

