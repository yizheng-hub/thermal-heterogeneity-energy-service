amendment: 29
date: 2026-11-01
timing: After the new full-year response pilot; before final common-budget response scores or selections were available
scope: Apply the existing terminal-recovery diagnostic to the new normal operations and isolated response trajectories
additional_EnergyPlus_runs: 0
changes_to_service_limits_accounting_horizon_or_action_selection: none
inventory: Every planned logical event-action; compute residuals for completed engineering-qualified physical action-baseline-event pairs and retain the full alias and unavailable mapping
time_samples: Final declared recovery hour and the next six hourly intervals, without wrapping across the end of the simulated year
endpoints:
  - Maximum and unweighted mean absolute zone operative-temperature difference from the matched normal operation
  - Signed hourly facility-electricity, HVAC-electricity and space-heating gas HHV differences
  - Signed six-hour electricity and space-heating gas differences, with the observed follow-up count
units: Hourly temperature averages; electricity and gas kWh per one-hour interval numerically equal their interval-mean kW, not instantaneous terminal states
missing_followup: Retain the number available out of six; do not infer full-year wraparound or complete recovery
summaries: Physical-pair and logical-evaluation counts remain distinct; no response-power or selected-action filtering
acceptance: Verify input hashes, matching hourly clocks, zone axes, finite values and complete inventory; no pass/fail threshold on residual magnitude
interpretation: Descriptive diagnostic of the existing 48-hour accounting boundary; neither a new independent experiment nor proof of complete recovery
