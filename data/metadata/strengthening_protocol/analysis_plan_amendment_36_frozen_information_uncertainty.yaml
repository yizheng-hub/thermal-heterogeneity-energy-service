  - For each metric use finite observed and reference values and original observed <= reference +1e-9C comparison
  - Candidate, baseline and reference use exactly the same demand draw for every corresponding identity
pre_nonzero_gate:
  - Reproduce all saved full-information service window values and nominal flags for every union-selected action, including actions originally selected only by means
  - Accept nominal service failures in mean selections; never filter these out or require favorable outcomes
  - Persist the zero-shift receipt before nonzero uncertainty results
closure:
  - Recompute full-selected per-draw masks in the independent union output, without changing old results
  - Match all6840 old full-selected scenario rows and47880 window summaries, using exact frequencies and1e-10C score tolerance
  - Preserve actual hashes of consumed inputs, executing helpers and outputs
outputs:
  - Canonical scoring-context inventory and logical choice mapping
  - Scenario-conditional service exceedance frequency and magnitude per selected operation and assessed window
  - Compressed per-draw pass masks with explicit context/scenario mapping
  - Per-draw all-case and common-nominal-baseline-subset power summaries, with both frozen selections checked against full individual demand
  - Separately show nominal mean-claimed power, full-checked frozen mean-selected power, full-checked frozen full-selected power and paired differences
  - Grouped climate and demand-composition summaries with their actual support
status_rules:
  resolved_no_action: Available power is0; selected-operation service frequency is not applicable
  nominal_normal_ineligible_or_unresolved: Missing availability and explicit status, never automatic zero or fallback
  perturbed_selected_operation_fails: Frozen selected response contributes0 available power without selecting another action
interpretation:
  - Conditional fixed-operation stress analysis, not calibrated real discomfort probabilities or population confidence intervals
  - Paired draw differences require same-draw masks, not subtraction of separate marginal quantiles
  - Positive-net policy and robust per-draw action optimization are outside this amendment
acceptance: Complete inventory, nominal reproduction and old-full closure; no required sign, ranking or claim retention
