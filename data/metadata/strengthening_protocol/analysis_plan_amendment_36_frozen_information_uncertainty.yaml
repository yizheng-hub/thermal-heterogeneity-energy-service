amendment: 36
date: 2026-11-01
timing: Amendment34 nominal full/mean information results and the original full-selected uncertainty are known; no mean-selected uncertainty outcome has been computed
question: How do the existing paired demand-error scenarios affect full-service availability of the frozen full-information and zone-mean selections?
additional_EnergyPlus_runs: 0
scope: A only, fixed physical operations and fixed nominal maximum-power choices; no per-draw action reselection or regenerated control
inventory:
  settings: 54
  events_per_setting: 8
  normal_menus: [building_search, zone_summary, zone_full]
  normal_energy_budgets: [0.95, 1.0, 1.05]
  known_selected_aliases_after_budget_deduplication: {full: 336, mean: 1270, union: 1276}
  known_unique_scoring_contexts: 441
  deduplication: Same climate, composition, normal operation, physical action, event and exact window definition; never deduplicate different demand compositions
fixed:
  - Original25C reference, original27 annual tail members, native person-hour window weights and unweighted annual tail mean
  - All normal operations, actions, physical powers, net electricity and nominal selections from amendment34
  - Same256 identity-keyed draws and seed2026103103 as the completed full-selected analysis
  - Alternative source-common and study/contributor-common SD grids0/0.25/0.5C crossed with person SD0/0.25/0.5C; do not stack the two shared terms
  - ASHRAE-only development temporal-proxy transports at fractions0.5and1 for both multi-record and single-record pools; no CTCD empirical transport
checks:
