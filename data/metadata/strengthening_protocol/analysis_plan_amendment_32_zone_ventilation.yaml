amendment: 32
date: 2026-11-01
timing: Cross-HVAC service and energy outcomes are known; dictionary availability checked before new zone-level ventilation results
scope: Diagnostic of all420 already-completed mechanism SQL records, preserving the105 common qualified setting pairs
additional_EnergyPlus_runs: 0
primary_variables:
  delivered: Zone Mechanical Ventilation Standard Density Volume Flow Rate
  requested: Zone Target Voz Ventilation Flow Rate
matching: Exact model zone identifiers and hourly calendar aligned with retained occupancy NPZ; use original study occupied mask and positive zone occupancy
endpoints:
  - Occupied zone-hours with positive request, available delivered/request ratio, minimum and first percentile
  - Zone-hours below99percent of native requested flow; reuse the previous total-flow diagnostic tolerance without changing engineering eligibility
  - Delivered and requested ventilation volume over assessed occupied zone-hours
comparisons: Mixed versus quarter-budget placement within the same system and setting; architecture contrasts remain internally paired
rules:
  - Read SQL without modifying indexes or original files
  - Retain missing variables, missing times and non-finite data as explicit unresolved diagnostics
  - Never treat system-total sufficiency as proof of each-zone delivery
  - Do not change the frozen qualification, service, energy or matching rules after inspecting ratios
  - Native hourly zone-flow outputs are interval averages; no claim of subhourly compliance
interpretation: Air-delivery diagnostic of the existing model comparison; not indoor-air-quality or health validation and not equal realized thermal-load certification
acceptance: Full record inventory and exact clock/zone provenance, with successful or unresolved status for every record; no requirement that all ratios exceed a threshold
