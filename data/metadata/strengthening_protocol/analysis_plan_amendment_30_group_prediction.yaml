amendment: 30
date: 2026-11-01
timing: Existing individual-model validation outcomes are known; pure-group comparator rules frozen before computing their final-test outcomes
scope: Additional participant-held-out prediction comparison using the existing frozen record assignments; not a prospectively blinded new dataset
additional_EnergyPlus_runs: 0
designs:
  timed_multi: Existing early-record calibration and strictly later no-change endpoint
  timed_single: Existing earliest-record calibration and the identical strictly later no-change endpoint
  undated_multi: Existing undated calibration/evaluation assignments and acceptability endpoint; no chronological claim
  undated_single: Existing first-assigned calibration record and the identical undated endpoint
individual_centers: Reuse raw and development-tuned shrinkage estimates; do not retune using new final outcomes
additional_nested_comparator: Use the exact development-fitted source/global prior from the existing shrinkage model with no personal calibration contribution; this prior retains the original development-record weighting and is reported separately from the unit-weighted early-center group baselines
pure_group_centers:
  weighting: One early-calibration center per development participant, not one weight per repeated record
  pooled: Mean and median across development participant centers
  study: Mean and median within source; use pooled fallback when fewer than three development participants
  building: Mean and median within source-building; fall back to study then pooled when fewer than three development participants
  development_prediction: Exclude the predicted development participant from all group-center fits
  final_prediction: Fit using all development participants; never use the final participant's early or late responses for a group center
common_prediction_rules:
  temperature_bounds_c: [16, 30]
  margin: Minimum distance to clipped center-plus-or-minus half-width endpoints
  half_width_grid_c: [0.5, 1, 1.5, 2, 2.5, 3]
  primary_width: One shared width selected by raw-individual development balanced accuracy, smaller width breaks ties
  secondary_width: Independently development-selected width per center model using the same grid and tie rule
  probability: Logistic regression of margin, C=1 and seed2026103101, fit on development responses only
  classification: Nonnegative temperature margin; do not select a probability cutoff on final responses
endpoints: [balanced_accuracy, AUROC, Brier_score, ten_bin_calibration, group_fallback_support]
uncertainty: 500 paired participant bootstrap draws within fixed source-building strata; retain all responses of a sampled participant, seed2026110101; descriptive conditional intervals, not global population inference
paired_contrasts: Raw and shrink individual models minus each pure-group model on identical final endpoint records, separately for shared and tuned widths
acceptance: Verify participant separation, assignment identities, center fit provenance and common endpoint support; no required personal-information advantage
