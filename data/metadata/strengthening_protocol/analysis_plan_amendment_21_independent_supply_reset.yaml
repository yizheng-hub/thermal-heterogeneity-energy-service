amendment: 21
date: 2026-10-31
scope: Independent climate confirmation of the already specified warmest-zone supply reset
timing: >-
  The original three-climate pilot is known: 14 operations passed and seven
  Brasilia operations failed. This amendment is written before the remaining
  climate pilots and remaining-cohort control outcomes. It changes execution
  handling, without changing the feedback controller or engineering thresholds.
purpose: >-
  Distinguish zone-feedback supply and reheat coordination from the separate
  outdoor-temperature reset, which has no zone-demand feedback.
unchanged:
  - The existing warmest-zone algorithm and supply-temperature limits 12.8 to 15.56 C.
  - Original operating commands, loads, ventilation and system-specific fixed capacities.
  - All original failed pilot operations and the original all-climate stop report.
confirmation:
  - Retain the existing seven-operation technical pilot in each of the original three climates.
  - Evaluate the same reference and six control operations in each of the remaining six climates.
  - Require all seven operations within a climate to pass the unchanged quality checks.
  - Run the twelve remaining cohort-control operations only in eligible climates.
  - Inventory all 171 originally intended logical operations, including unavailable operations.
  - Compare policies within each system and compare hardware/control interactions in matched settings.
  - Use no energy or service advantage as an eligibility rule.
budget:
  maximum_additional_logical_policy_operations: 138
  additional_common_design_preparations: 6
  initial_workers: 4
  annual_operation_cost_basis: Existing measured run times; no guarantee of runtime or success.
  storage: Local simulation directory; retain inputs, hourly outputs, warnings and engineering checks.
