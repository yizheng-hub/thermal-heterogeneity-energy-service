date: 2026-10-31
frozen_before_new_single_record_results: true
purpose: Match validation calibration support to the one-record demand representations used for simulated profiles, alongside the existing multiple-record validation.
design:
  participants_and_evaluation_records: Reuse the already frozen timed and undated participant and record partitions without alteration.
  timed_calibration_record: First record by timestamp then record ID within the frozen early calibration block.
  undated_calibration_record: First record in the saved calibration assignment order; no chronological interpretation.
  unused_early_records: Excluded from the individual calibration estimate in this arm.
  development_data: Only development participants supply source priors, missing clothing imputation, shrinkage selection, fixed-band selection and probability calibration.
  final_responses: Used only once after development selections are saved.
representations:
  centers: [single_record_Griffiths, source_shrinkage]
  shrinkage_k_grid: [2, 5, 10, 20]
  fixed_half_width_grid_c: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  ranges: [development_selected_fixed_width, published_personal_range]
  range_construction: Center plus or minus the frozen published half-width, clipped to 16-30 C exactly as in the original demand generator; fixed widths use the same clipping.
  prediction: Binary inclusion uses the smaller of the lower and upper signed margins; probability calibration uses development-only logistic regression on that margin.
endpoints:
  timed: No-change preference; reconstructed later reference-center error reported as an observational proxy separately.
  undated: Acceptability on participant-separated held-out records; not temporal extrapolation.
uncertainty: 500 participant resamples within source and building strata using seed 2026103102; no independent hourly sample claim.
selection: Minimum development Brier score selects shrinkage; maximum development balanced accuracy selects fixed width, ties to narrower width.
outputs: Frozen selections and record IDs, classification metrics and calibration, paired predictions, continuous proxy errors and validation status.
simulation_cost: Zero EnergyPlus runs; existing physical trajectories and controller commands unchanged.
success_criterion: Correct partition isolation, finite reproducible predictions and complete expected endpoints; no model must win.
