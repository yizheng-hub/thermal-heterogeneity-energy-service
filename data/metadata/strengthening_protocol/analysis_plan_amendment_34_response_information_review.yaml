amendment: 34
date: 2026-11-01
timing: Annual information outcomes and original response results known; new common-budget full response scores and choices not yet available
scope: Isolate event-service scoring representation on the same frozen normal operations and physical action menus
additional_EnergyPlus_runs: 0
fixed:
  - All54 settings, three normal-operation libraries, original annual full-demand qualification and three normal-energy budgets
  - Existing events, five mutually exclusive actions, protected zones, engineering status and each matched normal-operation history
  - Native-zone aggregation regardless of normal building/floor/zone command scope
  - Full-demand25C reference scores in every assessed window and original27 tail members
  - Native person-hour population and window-tail weights
representations:
  full: Original profile centers
  zone_mean: Replace each profile center by the mean center of its assigned native zone; do not average the reference service requirement or change individual interval endpoints
quality_gate_before_zone_mean_results:
  - Reproduce all completed full service values and qualification flags using the original explicit service scorer and frozen tail membership
  - Reproduce event power, carrier and preconditioning/recovery/full-window energy values
  - Reproduce original status, selected action ID and both maximum-power and positive-net-subset selections at every budget-event cell
  - Stop and preserve the attempt if the full reproduction differs; do not use new mean results to obscure it
service:
  baseline: Original pre-event check only when its reference has occupied weight, plus event and recovery checks
  action: The same occupied pre-event rule and the original event/recovery checks
  event_limit_factor: 1.0
  score_tolerance_c: 1.0e-9
selection:
  positive_event: Original event electricity reduction greater than1e-9kWh, not a substituted kW threshold
  order: Highest mean event facility-power reduction; action_id ascending breaks ties
  positive_net_policy: Among service-qualified positive-event actions with full-window net electricity strictly greater than zero, choose maximum event power
  engineering_unknown_or_normal_ineligible: Preserve status and missing capacity
  resolved_no_positive_action: Preserve status and a separate zero available-response field, without a fallback operation
outputs:
  - Full reproduction receipt and all-cell choice agreement
  - Both directions of action qualification disagreement and feasible-action-set differences
  - Per-event full and mean selected action, event power and full-window net electricity
  - Full-service reassessment of every mean-selected action and source of any exceedance
  - Separate baseline-window, action-precondition, action-event and action-recovery contributions
  - Paired available power differences including unilateral zero, grouped by climate, composition, menu and annual budget
  - Common full-and-mean baseline-window-qualified subset, with its support count
common_baseline_subset: For a normal-eligible engineering-resolved event, require full and zone-mean baseline-window qualification for every one of the five original actions, preserving any action-specific pre-event windows; never define this subset from the subsequently selected action
interpretation:
  - Nominal finite-menu information review, not a model of which protected actions a mean-only operator could construct
  - Does not include averaging-induced changes in annual normal-operation selection
  - No claim that constrained placement has been evaluated during response events
  - Existing selected-action uncertainty covers original full-selected actions only; no unrun mean-selected uncertainty implied
  - Repeated budgets and shared physical operations remain labeled correlated evaluations, not independent buildings or observations
acceptance: Complete declared inventory and full reproduction before comparison, with no required sign or ranking
